<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub — Digital Companion for College Students</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased flex flex-col font-sans transition-colors duration-200">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4 sm:px-0 [&>*]:pointer-events-auto"></div>

  <!-- App Wrapper -->
  <div id="app-root" class="min-h-full flex flex-col">
    <!-- Rendered dynamically by app.js: Either Landing Page or Main App Shell -->
  </div>

  <!-- Global Search Modal (Ctrl/Cmd + K) -->
  <div id="global-search-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-start justify-center pt-20 p-4">
    <div class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden modal-enter">
      <!-- Input box -->
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
        <i data-lucide="search" class="w-5 h-5 text-indigo-500 shrink-0"></i>
        <input type="text" id="global-search-input" placeholder="Search across courses, tasks, events, notes, clubs, marketplace... (Esc to close)" class="w-full bg-transparent text-sm sm:text-base text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none">
        <kbd class="hidden sm:inline-block text-[11px] px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 font-mono">ESC</kbd>
        <button id="global-search-close" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 sm:hidden">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Results list -->
      <div id="global-search-results" class="max-h-[60vh] overflow-y-auto p-3 space-y-2">
        <div class="text-center py-8 text-slate-400 text-xs font-medium">
          Start typing to search everything in CampusHub...
        </div>
      </div>

      <!-- Footer navigation hints -->
      <div class="px-4 py-2.5 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-500 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span>Navigate with <kbd class="px-1.5 py-0.5 rounded bg-white dark:bg-slate-700 font-mono shadow-xs">↑</kbd> <kbd class="px-1.5 py-0.5 rounded bg-white dark:bg-slate-700 font-mono shadow-xs">↓</kbd></span>
          <span>Open with <kbd class="px-1.5 py-0.5 rounded bg-white dark:bg-slate-700 font-mono shadow-xs">↵</kbd></span>
        </div>
        <span>CampusHub Instant Index</span>
      </div>
    </div>
  </div>

  <!-- ES Module Application Controller -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
